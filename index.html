<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>芥子 · 宿舍桌面数字化底座</title>
<style>
  html,body{margin:0;height:100%;background:#14161A;color:#E8E4DC;
            font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
        padding:24px;box-sizing:border-box;text-align:center}
  .box{width:96px;height:96px;border:3px solid #F5F2EA;position:relative;margin-bottom:34px}
  .dot{position:absolute;left:50%;bottom:-1px;transform:translate(-50%,0);
       width:30px;height:30px;border-radius:50%;background:#C9A227}
  h1{font-size:26px;font-weight:600;letter-spacing:6px;margin:0 0 10px}
  .sub{color:#8B857C;font-size:13px;letter-spacing:2px;margin-bottom:40px}
  .card{background:#1B1E24;border:1px solid #2C3038;border-radius:14px;padding:26px 22px;max-width:420px}
  .card b{color:#C9A227;font-size:15px;display:block;margin-bottom:14px}
  .card p{margin:0;color:#9A948A;font-size:13.5px;line-height:2}
  .foot{margin-top:36px;color:#4D4943;font-size:11.5px;letter-spacing:1px}
</style>
</head>
<body>
<div class="wrap">
  <div class="box"><div class="dot"></div></div>
  <h1>芥子</h1>
  <div class="sub">宿舍桌面 · 数字化底座</div>

  <div class="card">
    <b>页面还没有上传</b>
    <p>把「芥子宿舍模型.html」改名成 <code>index.html</code>，<br>
       拖进这个仓库覆盖本文件即可。</p>
  </div>

  <div class="foot">JIEZI · 2026</div>
</div>
</body>
</html>
